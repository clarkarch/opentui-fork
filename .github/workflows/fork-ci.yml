name: fork-ci

# The fork's own gate. It proves the two things a downstream Rust project
# depends on: the crates build and link against the patched native library,
# and a project that depends on this repository builds the way a downstream
# project does.
#
# The release artifacts are built by native-artifacts.yml; this workflow builds
# the host library only, because the Rust checks need one target.

on:
  workflow_dispatch:
  push:
    branches: [tfm]
    paths:
      - "packages/native/**"
      - "packages/rust/**"
      - ".github/workflows/fork-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    name: rust crates and a git dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository's own action: the Zig version comes from
      # packages/native/build.zig.zon.
      - uses: ./.github/actions/setup-zig

      - name: Prepare zig dependencies
        working-directory: packages/native
        # Only the vendored sources: the fork ships no FFmpeg, so the native
        # video decoder stays unavailable and no decoder prefix is built.
        run: sh scripts/prepare-zig-deps.sh

      - name: Build the native library
        working-directory: packages/native
        run: zig build -Doptimize=ReleaseFast

      - name: Strip a copy the way the release does
        # The release ships stripped libraries, and the committed artifacts are
        # copied from it. A strip that breaks the static archive would break
        # every Rust consumer, so the checks below run against the stripped
        # copy, not the build.
        run: |
          dir="$GITHUB_WORKSPACE/packages/native/lib/x86_64-linux"
          stripped="$RUNNER_TEMP/stripped"
          mkdir -p "$stripped"
          cp "$dir/libopentui.so" "$dir/libopentui.a" "$dir/opentui.h" "$stripped/"
          if ! command -v llvm-strip >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          llvm-strip --strip-unneeded "$stripped/libopentui.so" "$stripped/libopentui.a"
          ls -l "$stripped"

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: |
          rustup toolchain install
          cargo fetch --locked

      - name: Run the Rust workspace checks
        working-directory: packages/rust
        env:
          CI: "true"
          # The stripped copy: the same files the release and the committed
          # artifacts carry, with the header beside them.
          OPENTUI_LIB_DIR: ${{ runner.temp }}/stripped
        run: sh test.sh all

      - name: Build a project that depends on this repository
        # The consumer clones this repository and builds the crates from the
        # clone, so it finds the committed artifacts, not this job's build.
        # Until the artifacts are committed, the library comes from this
        # job's build.
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}/packages/native/lib/x86_64-linux
        run: sh packages/rust/scripts/consumer-smoke.sh

      - name: Build a project against the release artifacts
        # The path a consumer on a platform the repository does not carry
        # takes: fetch the artifacts from the release, point OPENTUI_LIB_DIR
        # at them, build. The script is the one the README tells consumers to
        # use, so the CI uses it too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(sh packages/rust/scripts/fetch-native.sh x86_64-linux)
          ls -l "$dir"
          OPENTUI_LIB_DIR="$dir" sh packages/rust/scripts/consumer-smoke.sh
