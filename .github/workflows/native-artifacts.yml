name: native-artifacts

# Builds the patched native library for every supported target and publishes it
# as a GitHub release (`native-latest`). Downstream projects (e.g. tedit) fetch
# the asset for their host from `native-artifacts.json`.
#
# The Linux glibc artifacts are also committed to the branch (see PREBUILT.md);
# the release exists so that macOS and Windows hosts — which cannot be served
# by a committed Linux binary — get the patched library too.

on:
  workflow_dispatch:
  push:
    branches: [tfm]
    paths:
      - "packages/native/**"
      - "scripts/build-native-manifest.ts"
      - ".github/workflows/native-artifacts.yml"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.output }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: x86_64-linux
            targets: x86_64-linux-gnu.2.17
            dirs: x86_64-linux
            os: ubuntu-latest
            file: libopentui.so
          - output: aarch64-linux
            targets: aarch64-linux-gnu.2.17
            dirs: aarch64-linux
            os: ubuntu-latest
            file: libopentui.so
          - output: x86_64-linux-musl
            targets: x86_64-linux-musl
            dirs: x86_64-linux-musl
            os: ubuntu-latest
            file: libopentui.so
          - output: aarch64-linux-musl
            targets: aarch64-linux-musl
            dirs: aarch64-linux-musl
            os: ubuntu-latest
            file: libopentui.so
          - output: x86_64-windows
            targets: x86_64-windows-gnu
            dirs: x86_64-windows
            os: ubuntu-latest
            file: opentui.dll
          - output: aarch64-windows
            targets: aarch64-windows-gnu
            dirs: aarch64-windows
            os: ubuntu-latest
            file: opentui.dll
          # macOS needs the macOS SDK to link CoreAudio; Zig cannot cross to
          # Darwin without it, so these build on a macOS host. Both arches
          # build in one job: the macOS runner pool is small, and two jobs
          # waiting for it is how a whole release gets cancelled.
          - output: macos
            targets: x86_64-macos.13.0 aarch64-macos.13.0
            dirs: x86_64-macos aarch64-macos
            os: macos-latest
            file: libopentui.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The repository's own action: it reads the Zig version from
      # packages/native/build.zig.zon, so an upstream bump cannot leave this
      # workflow building with an old compiler.
      - uses: ./.github/actions/setup-zig

      - name: Prepare zig dependencies
        working-directory: packages/native
        # Only the vendored sources: the fork ships no FFmpeg, so the native
        # video decoder stays unavailable and no decoder prefix is built.
        run: sh scripts/prepare-zig-deps.sh

      - name: Build
        working-directory: packages/native
        run: |
          for target in ${{ matrix.targets }}; do
            zig build -Doptimize=ReleaseFast -Dlibrary-target="$target"
          done

      - name: Verify and strip
        working-directory: packages/native
        run: |
          # The release copies are stripped so downloads stay small. The static
          # archive is stripped too: it is what the Rust crates link by default,
          # and unstripped it is 51 MB against 8 MB stripped.
          #
          # llvm-strip, not strip: the host's strip only understands the host
          # architecture, so the aarch64 libraries kept every symbol (29 MB
          # instead of 5 MB) — and the failure was swallowed, so nobody saw
          # it. llvm-strip is multi-target, and a failed strip now fails the
          # build instead of shipping a fat library.
          for dir in ${{ matrix.dirs }}; do
            lib="lib/$dir/${{ matrix.file }}"
            if [ ! -f "$lib" ]; then
              echo "expected $lib to exist after the build"
              ls -R lib || true
              exit 1
            fi
            archive="lib/$dir/libopentui.a"
            if [ "${{ runner.os }}" = "Linux" ]; then
              if ! command -v llvm-strip >/dev/null; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq llvm
              fi
              llvm-strip --strip-unneeded "$lib"
              [ -f "$archive" ] && llvm-strip --strip-unneeded "$archive"
            else
              strip -x "$lib"
              # BSD strip reads no archives; llvm-strip does. The runner's
              # Xcode ships no llvm-strip (xcrun cannot find it), so take the
              # one Homebrew installs.
              if [ -f "$archive" ]; then
                brew install llvm
                "$(brew --prefix llvm)/bin/llvm-strip" --strip-unneeded "$archive"
              fi
            fi
            # The header travels with the library: the Rust crates check it
            # against the bindings they were generated from, so a consumer needs
            # it beside the library it links.
            [ -f "lib/$dir/opentui.h" ] || { echo "expected lib/$dir/opentui.h to exist after the build"; exit 1; }
            ls -l "lib/$dir"
          done

      - uses: actions/upload-artifact@v4
        with:
          # The whole directory: the library, the static archive, and the
          # header the crates check their bindings against. One directory per
          # target, so the publish job reads the target from the directory.
          name: native-${{ matrix.output }}
          path: packages/native/lib/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The manifest script lives in the repository: without the checkout the
      # publish job has no source tree at all.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          for artifact in artifacts/native-*; do
            # An artifact holds one directory per target the job built.
            for dir in "$artifact"/*/; do
              [ -d "$dir" ] || continue
              target=$(basename "$dir")
              # Every file of the target directory travels: the library, the
              # static archive, and the header.
              for file in "$dir"*; do
                name=$(basename "$file")
                # Windows' static archive is not usable by the Rust crates:
                # they link the DLL there, through its import library. It is
                # 50 MB unstripped, so it stays out of the release.
                case "$target/$name" in
                  *-windows/opentui-static.lib) continue ;;
                esac
                cp "$file" "release/native-${target}-${name}"
              done
            done
          done
          ls -l release

      - name: Build the manifest
        run: bun scripts/build-native-manifest.ts release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view native-latest >/dev/null 2>&1; then
            gh release upload native-latest release/* --clobber
          else
            gh release create native-latest release/* \
              --title "native artifacts" \
              --notes "Patched libopentui for every supported target. Fetch the asset for your host via native-artifacts.json."
          fi
